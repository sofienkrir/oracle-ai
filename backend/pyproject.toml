[project]
name = "oracle-ai"
version = "0.2.0"
description = "ORACLE AI — plateforme d'intelligence décisionnelle explicable (backend FastAPI)"
requires-python = ">=3.11,<3.14"
license = { text = "TBD — voir README" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "python-calamine>=0.2",  # lecteur XLSX rapide (Rust) ; repli automatique sur openpyxl
]

[project.optional-dependencies]
# Étapes ultérieures : installées seulement quand les modules correspondants existent.
ml = ["scikit-learn>=1.4", "statsmodels>=0.14", "scipy>=1.11"]
causal = ["dowhy>=0.11"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false  # application, pas une librairie : lancée depuis backend/

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accents français dans les chaînes/commentaires

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
